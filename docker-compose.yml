services:
  infra:
    platform: linux/amd64
    build:
      context: .
      dockerfile: terraform/docker/Dockerfile
    image: de-agent-terraform:latest
    env_file:
      - terraform/.env
    volumes:
      - ./terraform:/workspace
    stdin_open: true
    tty: true

  # Azurite emulation for local Blob Storage and Storage Queue
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"  # Blob Storage
      - "10001:10001"  # Queue Storage
    environment:
      AZURITE_ACCOUNTS: "devstoreaccount1:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 && nc -z 127.0.0.1 10001"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL with pgvector for local development
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  azurite_data:
  postgres_data:
